<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Викинг: Выживание</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
html,body{margin:0;padding:0;background:#0d0f14;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0}

<body>
<canvas id="cv"></canvas>
<script>
'use strict';
(function(){
/* ================= УТИЛИТЫ ================= */
const TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const irnd=(a,b)=>Math.floor(rnd(a,b+1));
const cl=(v,a,b)=>v<a?a:(v>b?b:v);
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=t=>{const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+(s<10?'0':'')+s;};

/* ================= TELEGRAM ================= */
const TG=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
const IN_TG=!!TG;
if(TG){try{TG.ready();TG.expand();if(TG.setHeaderColor)TG.setHeaderColor('#0d0f14');if(TG.setBackgroundColor)TG.setBackgroundColor('#0d0f14');if(TG.disableVerticalSwipes)TG.disableVerticalSwipes();if(TG.requestFullscreen)TG.requestFullscreen().catch(function(){});}catch(e){}}

/* ================= КАНВАС ================= */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=360,H=360,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth||360;H=window.innerHeight||360;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';}
window.addEventListener('resize',resize);resize();

/* ================= СОХРАНЕНИЕ ================= */
const SKEY='vikingTG_save_v1';
const DEF_SAVE={gold:0,forge:{sharp:0,freya:0,armor:0,revive:0},rec:{time:0,kills:0,paragon:0,hero:''}};
function freshSave(){return JSON.parse(JSON.stringify(DEF_SAVE));}
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SKEY));if(s&&s.forge){return Object.assign(freshSave(),s);}}catch(e){}return freshSave();}
function saveNow(){try{localStorage.setItem(SKEY,JSON.stringify(SAVE));}catch(e){}}
let SAVE=loadSave();

/* ================= ЗВУК ================= */
const SFX={ctx:null,on:true,
 init:function(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
 beep:function(f,d,type,v){if(!this.on)return;this.init();const c=this.ctx;if(!c)return;try{const o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(v||0.05,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);}catch(e){}},
 hit:function(){this.beep(170,0.05,'square',0.03)},
 kill:function(){this.beep(95,0.1,'sawtooth',0.04)},
 pick:function(){this.beep(680,0.05,'sine',0.04)},
 lvl:function(){this.beep(520,0.09,'triangle',0.05);const s=this;setTimeout(function(){s.beep(790,0.12,'triangle',0.05);},90);},
 death:function(){this.beep(110,0.5,'sawtooth',0.07)},
 coin:function(){this.beep(900,0.04,'sine',0.03)},
 roar:function(){this.beep(60,0.6,'sawtooth',0.09);}};

/* ================= ДАННЫЕ ================= */
const HEROES={
 bjorn:{name:'Бьёрн',hp:130,spd:1.0,dmg:1.1,c:'#3a6ea5',perk:'Латы: -1 к получаемому урону'},
 sigrid:{name:'Сигрид',hp:95,spd:1.15,dmg:0.95,c:'#3aa56e',perk:'Двойной выстрел'},
 erik:{name:'Эрик',hp:105,spd:1.05,dmg:1.0,c:'#a53a8a',perk:'Критический удар x2'}};
const WPN={
 axe:{name:'Секира',desc:'Летящие секиры по кругу',max:8},
 bow:{name:'Лук',desc:'Стрелы в ближайшего врага',max:8},
 shield:{name:'Щиты',desc:'Вращающиеся щиты-орбита',max:8},
 bolt:{name:'Молния',desc:'Разряды с неба',max:8}};
const EVOS=[
 {id:'mjolnir',need:['axe','bolt'],name:'Мьёльнир',desc:'Молот: сокрушительные разряды'},
 {id:'gale',need:['shield','bow'],name:'Вихрь Вальгаллы',desc:'Шквал щитов и стрел'}];
const PASS=[
 {id:'might',name:'Сила',max:5,desc:'+10% урона'},
 {id:'haste',name:'Прыть',max:5,desc:'+8% скорости атаки'},
 {id:'magnet',name:'Магнит',max:5,desc:'+25% радиус сбора'},
 {id:'vigor',name:'Жилка',max:5,desc:'+20 к максимальному здоровью'},
 {id:'armor',name:'Латы',max:5,desc:'-2 к получаемому урону'}];
const ET={
 goblin:{hp:20,spd:55,r:14,dmg:8,gold:1,xp:1,c:'#5c8a3a'},
 wolf:{hp:28,spd:88,r:13,dmg:10,gold:2,xp:1,c:'#6b6b7a'},
 brute:{hp:90,spd:38,r:22,dmg:18,gold:4,xp:3,c:'#8a5a3a'},
 skel:{hp:34,spd:60,r:15,dmg:10,gold:2,xp:2,c:'#b9b9a8'},
 imp:{hp:26,spd:70,r:14,dmg:12,gold:2,xp:2,c:'#a03a5a'}};
const FORGE=[
 {id:'sharp',name:'Заточка клинков',desc:'+5% к урону за уровень',max:5,base:60},
 {id:'freya',name:'Благословение Фрейи',desc:'+10% к опыту и золоту',max:5,base:50},
 {id:'armor',name:'Рунная броня',desc:'+15 к стартовому здоровью',max:5,base:55},
 {id:'revive',name:'Второй шанс',desc:'Воскрешение с 50% HP',max:1,base:400}];
function forgePrice(u){return Math.round(u.base*Math.pow(1.9,SAVE.forge[u.id]||0));}
const CURSES=[
 {id:'fenrir',name:'Ярость Фенрира',desc:'+30% скорости врагов, +50% золота'},
 {id:'horde',name:'Нашествие орды',desc:'x1.5 врагов, +50% опыта и золота'}];
const PAR_OPTS=[
 {id:'dmg',name:'Мощь Одина',desc:'+5% к общему урону'},
 {id:'haste',name:'Прыть Вальгаллы',desc:'+5% к скорости атаки'},
 {id:'hp',name:'Стойкость',desc:'+10 к максимальному здоровью'},
 {id:'gold',name:'Мешок золота',desc:'+50 монет сразу'}];

/* ================= СПРАЙТЫ (вектор) ================= */
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
function tri(x1,y1,x2,y2,x3,y3){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.closePath();ctx.fill();}
function drawSpr(id,x,y,s,rot,c){ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);const u=s/32;ctx.scale(u,u);
 switch(id){
 case 'viking':
  ctx.fillStyle=c||'#2a3b55';ctx.fillRect(-8,2,16,20);ctx.fillRect(-11,4,6,14);ctx.fillRect(5,4,6,14);
  ctx.fillStyle='#e8c39e';circle(0,-6,7);
  ctx.fillStyle='#9aa3b5';ctx.beginPath();ctx.arc(0,-8,7.5,Math.PI,0);ctx.fill();ctx.fillRect(-7.5,-8,15,3);
  ctx.fillStyle='#e8dcc8';tri(-7,-9,-13,-17,-5,-10);tri(7,-9,13,-17,5,-10);
  ctx.fillStyle='#1c2331';circle(-2.5,-6,1);circle(2.5,-6,1);
  ctx.fillStyle='#5a4632';ctx.fillRect(-14,2,4,10);ctx.fillRect(10,-2,3,14);
  break;
 case 'goblin':
  ctx.fillStyle=c||'#5c8a3a';circle(0,2,9);circle(0,-7,6.5);
  ctx.fillStyle='#5c8a3a';tri(-6,-9,-12,-14,-4,-8);tri(6,-9,12,-14,4,-8);
  ctx.fillStyle='#f2e14c';circle(-2.5,-8,1.2);circle(2.5,-8,1.2);
  break;
 case 'wolf':
  ctx.fillStyle=c||'#6b6b7a';ctx.fillRect(-10,-3,20,9);circle(9,-5,5);
  tri(-10,-3,-16,2,-8,3);tri(7,-9,9,-14,11,-8);
  ctx.fillStyle='#ff5040';circle(11,-6,1);
  break;
 case 'brute':
  ctx.fillStyle=c||'#8a5a3a';circle(0,4,11);circle(0,-8,7.5);
  ctx.fillStyle='#3a2c20';ctx.fillRect(-6,-16,12,4);ctx.fillRect(-8,-15,3,4);ctx.fillRect(5,-15,3,4);
  ctx.fillStyle='#f2e14c';circle(-2.5,-9,1.3);circle(2.5,-9,1.3);
  break;
 case 'skel':
  ctx.fillStyle=c||'#b9b9a8';circle(0,-7,6);ctx.fillRect(-5,0,10,14);
  ctx.fillStyle='#1c2331';circle(-2,-8,1.2);circle(2,-8,1.2);
  ctx.fillRect(-3,-4,6,1.5);ctx.fillRect(-3,-1.5,6,1.5);
  break;
 case 'imp':
  ctx.fillStyle=c||'#a03a5a';circle(0,3,8);circle(0,-7,6);
  ctx.fillStyle='#f2e14c';tri(-4,-11,-8,-17,-2,-11);tri(4,-11,8,-17,2,-11);
  ctx.fillStyle='#ffef70';circle(-2.3,-7,1.2);circle(2.3,-7,1.2);
  break;
 case 'boss':
  ctx.fillStyle='#4a2c4a';circle(0,4,14);circle(0,-9,9);
  ctx.fillStyle='#f2c14e';ctx.fillRect(-7,-20,14,4);tri(-7,-16,-5,-21,-3,-16);tri(5,-16,7,-21,3,-16);ctx.fillRect(-3,-16,6,2);
  ctx.fillStyle='#ff3040';circle(-3.5,-10,1.6);circle(3.5,-10,1.6);
  break;
 case 'champ':
  ctx.fillStyle='#7a1f1f';circle(0,3,12);circle(0,-8,8);
  ctx.fillStyle='#2c2c34';ctx.fillRect(-8,-19,16,5);
  ctx.fillStyle='#ff3040';circle(-3,-9,1.8);circle(3,-9,1.8);
  break;
 case 'chest':
  ctx.fillStyle='#6a4a2a';ctx.fillRect(-11,-7,22,14);ctx.fillStyle='#8a6a3a';ctx.fillRect(-11,-7,22,5);
  ctx.fillStyle='#f2c14e';ctx.fillRect(-2,-3,4,4);ctx.fillRect(-11,2,22,2);
  break;
 case 'gem':
  ctx.fillStyle=c||'#3ad0e0';tri(0,-9,8,0,0,9);tri(0,-9,-8,0,0,9);
  ctx.fillStyle='rgba(255,255,255,0.5)';tri(0,-6,3.5,0,0,4);
  break;
 case 'coin':
  ctx.fillStyle='#f2c14e';circle(0,0,7);ctx.fillStyle='#b8860b';ctx.strokeStyle='#b8860b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,4.5,0,TAU);ctx.stroke();
  break;
 case 'axe':
  ctx.fillStyle='#5a4632';ctx.fillRect(-2,-12,4,24);
  ctx.fillStyle='#b8c2cc';tri(2,-12,14,-8,2,-2);ctx.fillStyle='#8a94a0';tri(2,-8,9,-6,2,-4);
  break;
 case 'shield':
  ctx.fillStyle='#7a5a34';circle(0,0,10);ctx.fillStyle='#5a4326';circle(0,0,10);ctx.beginPath();ctx.arc(0,0,10,-0.5,1.6);ctx.lineTo(0,0);ctx.fill();
  ctx.fillStyle='#98a2ae';circle(0,0,3.5);ctx.strokeStyle='#3a2c20';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,8.5,0,TAU);ctx.stroke();
  break;
 case 'bolt':
  ctx.fillStyle='#f2e14c';tri(2,-14,-5,0,1,0);tri(1,0,-3,14,5,-1);
  break;
 case 'mjolnir':
  ctx.fillStyle='#5a4632';ctx.fillRect(-2.5,-4,5,16);
  ctx.fillStyle='#8a94a2';ctx.fillRect(-9,-13,18,10);
  ctx.fillStyle='#4fc3f7';ctx.fillRect(-6,-11,3,2);ctx.fillRect(3,-11,3,2);
  break;
 case 'arrow':
  ctx.fillStyle='#8a6a3a';ctx.fillRect(-8,-1.5,13,3);ctx.fillStyle='#c8d2dc';tri(5,-4,11,0,5,4);
  break;
 case 'heart':
  ctx.fillStyle='#e04060';ctx.beginPath();ctx.moveTo(0,8);ctx.bezierCurveTo(-11,-2,-5,-11,0,-4);ctx.bezierCurveTo(5,-11,11,-2,0,8);ctx.fill();
  break;
 case 'skull':
  ctx.fillStyle='#e8e4d8';circle(0,-2,7);ctx.fillRect(-4,3,8,5);
  ctx.fillStyle='#1c2331';circle(-2.5,-3,1.8);circle(2.5,-3,1.8);
  break;
 }
ctx.restore();}

/* ================= СОСТОЯНИЕ ================= */
const G={mode:'menu',hero:'bjorn',t:0,px:0,py:0,hp:0,hpm:100,lvl:1,xp:0,xpn:6,
 kills:0,gold:0,w:{},p:{},evo:{},par:0,pdmg:1,phaste:1,
 curses:{},rlv:0,champT:0,bossN:0,nextBoss:60,spawnT:0,pend:0,
 cards:null,roul:null,roulA:0,roulSpd:0,roulRes:-1,roulT:0,
 revive:0,flash:0,banner:null,bannerT:0,E:[],P:[],GEM:[],COIN:[],CHEST:[],FL:[],PART:[],
 shake:0,heroC:'#3a6ea5',shrine:[]};
let E=G.E,P=G.P,GEM=G.GEM,COIN=G.COIN,CHEST=G.CHEST,FL=G.FL,PART=G.PART,SHRINE=G.shrine;
const WMAX=4,PMAX=5,WLVLMAX=8;

function plvl(id){const v=G.p[id];return (typeof v==='number')?v:0;}
function wlvl(id){const v=G.w[id];return (typeof v==='number')?v:0;}
function dmgMul(){return (1+0.1*plvl('might'))*(1+0.05*SAVE.forge.sharp)*G.pdmg;}
function atkMul(){return (1+0.08*plvl('haste'))*G.phaste;}
function pickR(){return 34*(1+0.25*plvl('magnet'));}
function goldMul(){return (1+0.1*SAVE.forge.freya)*(G.curses.fenrir?1.5:1)*(G.curses.horde?1.5:1);}
function xpMul(){return (1+0.1*SAVE.forge.freya)*(G.curses.horde?1.5:1);}

function startRun(){
 const H0=HEROES[G.hero];
 G.mode='play';G.t=0;G.px=0;G.py=0;G.lvl=1;G.xp=0;G.xpn=6;G.kills=0;G.gold=0;
 G.w={};G.p={};G.evo={};G.par=0;G.pdmg=1;G.phaste=1;G.curses={};G.rlv=0;G.champT=0;
 G.bossN=0;G.nextBoss=60;G.spawnT=0;G.pend=0;G.cards=null;G.roul=null;G.revive=SAVE.forge.revive||0;
 G.flash=0;G.banner=null;G.bannerT=0;G.shake=0;
 G.hpm=H0.hp+15*SAVE.forge.armor;G.hp=G.hpm;G.heroC=H0.c;G.w={axe:1};
 E.length=0;P.length=0;GEM.length=0;COIN.length=0;CHEST.length=0;FL.length=0;PART.length=0;SHRINE.length=0;
 for(let i=0;i<3;i++){const a=rnd(0,TAU);SHRINE.push({x:G.px+Math.cos(a)*rnd(400,900),y:G.py+Math.sin(a)*rnd(400,900),used:false});}
 spawnE(ET.goblin,3);
}
function toMenu(){G.mode='menu';}

/* ================= ВРАГИ ================= */
function ragnMul(){return G.rlv>0?Math.pow(1.15,G.rlv):1;}
function spawnE(base,n,opts){
 opts=opts||{};
 for(let i=0;i<(n||1);i++){
  const m=ragnMul();
  const a=rnd(0,TAU),R=Math.max(W,H)*0.6+60;
  const e={x:G.px+Math.cos(a)*R,y:G.py+Math.sin(a)*R,
   t:base,def:base,
   hp:base.hp*m*(opts.hpMul||1),mhp:base.hp*m*(opts.hpMul||1),
   r:base.r*(opts.scale||1),spd:base.spd*(G.curses.fenrir?1.3:1)*(opts.spdMul||1),
   dmg:base.dmg*(opts.dmgMul||1),elite:!!opts.elite,champ:!!opts.champ,
   seed:Math.random()*1000,hitT:0,atkT:0,boss:!!opts.boss};
  e.hp=Math.round(e.hp);e.mhp=e.hp;
  E.push(e);
 }
}
function spawnWave(){
 const min=Math.floor(G.t/60)+1;
 const pool=['goblin','goblin','wolf','skel'];
 if(min>=2)pool.push('imp');
 if(min>=3)pool.push('brute','wolf');
 if(min>=5)pool.push('brute');
 let n=1+Math.floor(min*0.8);
 if(G.curses.horde)n=Math.ceil(n*1.5);
 if(E.length>140)n=Math.min(n,3);
 for(let i=0;i<n;i++)spawnE(ET[pick(pool)],1);
}
function spawnChampion(){
 const base=ET[pick(['goblin','wolf','brute','skel'])];
 spawnE(base,1,{champ:true,elite:true,scale:1.6,hpMul:6,dmgMul:1.3,spdMul:0.9});
 SFX.roar();
}
function spawnBoss(){
 G.bossN++;
 const min=Math.floor(G.t/60)+1;
 const base=ET[pick(['brute','imp'])];
 spawnE(base,1,{boss:true,scale:2.2,hpMul:12*Math.pow(1.35,G.bossN-1),dmgMul:1.5,spdMul:0.8});
 G.nextBoss=G.t+60;
 SFX.roar();
}
function hurtEnemy(e,dmg,kx,ky){
 if(e.hp<=0)return;
 dmg*=dmgMul();
 if(G.hero==='erik'&&Math.random()<0.15)dmg*=2;
 if(e.boss||e.champ)dmg*=1;
 e.hp-=dmg;e.hitT=0.12;
 if(kx){e.x+=kx;e.y+=ky;}
 if(e.hp<=0)killEnemy(e);
 else SFX.hit();
}
function killEnemy(e){
 const i=E.indexOf(e);if(i<0)return;E.splice(i,1);
 G.kills++;SFX.kill();
 const big=e.boss||e.champ;
 for(let k=0;k<(big?4:1);k++)GEM.push({x:e.x+rnd(-10,10),y:e.y+rnd(-10,10),v:(e.def.xp*(big?3:1))*(big?2:1),big:big});
 for(let k=0;k<(big?4:1);k++)COIN.push({x:e.x+rnd(-12,12),y:e.y+rnd(-12,12),v:e.def.gold*(big?3:1)});
 for(let k=0;k<(big?10:3);k++)PART.push({x:e.x,y:e.y,vx:rnd(-60,60),vy:rnd(-60,60),t:rnd(0.2,0.5),c:e.def.c});
 if(big){CHEST.push({x:e.x,y:e.y,t:0});}
}
function playerHit(dmg){
 dmg=Math.max(1,dmg-plvl('armor')*2-(G.hero==='bjorn'?1:0));
 G.hp-=dmg;G.flash=0.25;SFX.beep(140,0.12,'square',0.06);
 if(G.hp<=0){
  if(G.revive>0){G.revive--;G.hp=Math.round(G.hpm*0.5);G.flash=0.6;setBanner('ВОЗРОЖДЕНИЕ! Один даёт второй шанс');}
  else die();
 }
}
function die(){
 G.mode='dead';SFX.death();
 SAVE.gold+=G.gold;
 if(G.t>SAVE.rec.time)SAVE.rec.time=G.t;
 if(G.kills>SAVE.rec.kills)SAVE.rec.kills=G.kills;
 if(G.par>SAVE.rec.paragon)SAVE.rec.paragon=G.par;
 if(G.t>=SAVE.rec.time*0.9)SAVE.rec.hero=HEROES[G.hero].name;
 saveNow();
}

/* ================= ОРУЖИЕ ================= */
const WT={};let axeA=0;
WT.axe={cd:1.4,fire:function(){
 const n=1+Math.floor(wlvl('axe')/2);
 for(let i=0;i<n;i++){
  const a=axeA+i*TAU/n;
  P.push({x:G.px,y:G.py,vx:Math.cos(a)*170,vy:Math.sin(a)*170,dmg:16*wLvlMul('axe'),life:1.1,spr:'axe',r:12,rot:a,rotV:9,pierce:3});
 }
 axeA+=0.7;SFX.beep(220,0.05,'square',0.02);}};
WT.bow={cd:0.9,fire:function(){
 const t=nearestEnemy(400);if(!t)return;
 const a=Math.atan2(t.y-G.py,t.x-G.px);
 const n=(G.hero==='sigrid')?2:1;
 for(let i=0;i<n;i++){
  P.push({x:G.px,y:G.py,vx:Math.cos(a+(i?0.08:0))*300,vy:Math.sin(a+(i?0.08:0))*300,dmg:10*wLvlMul('bow'),life:1.2,spr:'arrow',r:8,rot:a});
 }
 SFX.beep(440,0.04,'sine',0.02);}};
WT.shield={cd:0,passive:true};
WT.bolt={cd:2.0,fire:function(){
 const t=nearestEnemy(320);if(!t)return;
 P.push({x:t.x,y:t.y-200,vy:600,dmg:22*wLvlMul('bolt'),life:0.4,spr:'bolt',r:16,bolt:true});
 SFX.beep(1200,0.08,'sawtooth',0.03);}};
WT.mjolnir={cd:1.1,fire:function(){
 const t=nearestEnemy(500);if(!t)return;
 P.push({x:G.px,y:G.py,vx:Math.cos(Math.atan2(t.y-G.py,t.x-G.px))*350,vy:Math.sin(Math.atan2(t.y-G.py,t.x-G.px))*350,dmg:40*wLvlMul('axe'),life:1.0,spr:'mjolnir',r:18,rot:0,rotV:12,big:true});
 setTimeoutS(0.6,function(){P.push({x:t.x,y:t.y-220,vy:700,dmg:60*dmgMul(),life:0.4,spr:'bolt',r:26,bolt:true,big:true});});
 SFX.beep(90,0.2,'sawtooth',0.05);}};
WT.gale={cd:0.35,fire:function(){
 const a=rnd(0,TAU);
 P.push({x:G.px,y:G.py,vx:Math.cos(a)*260,vy:Math.sin(a)*260,dmg:16*wLvlMul('shield'),life:1.0,spr:'shield',r:12,rot:a,rotV:10});
 P.push({x:G.px,y:G.py,vx:Math.cos(a)*300,vy:Math.sin(a)*300,dmg:12*wLvlMul('bow'),life:1.0,spr:'arrow',r:8,rot:a});
 SFX.beep(600,0.03,'sine',0.015);}};
const WTMR={};
function wLvlMul(id){return 1+0.18*wlvl(id);}
function nearestEnemy(R){
 let best=null,bd=R*R;
 for(let i=0;i<E.length;i++){const e=E[i];const d=dist2(G.px,G.py,e.x,e.y);if(d<bd){bd=d;best=e;}}
 return best;
}
let SQUEUE=[];
function setTimeoutS(d,f){SQUEUE.push({t:G.t+d,f:f});}

function fireWeapons(dt){
 const hs=atkMul();
 for(const id in WT){
  if(id==='shield')continue;
  const ab=(G.evo.mjolnir&&(id==='axe'||id==='bolt'))||(G.evo.gale&&(id==='shield'||id==='bow'));
  if(ab)continue;
  if(G.w[id]||G.evo[id]){
   if(!WT[id])continue;
   WTMR[id]=(WTMR[id]||0)+dt;
   const cd=WT[id].cd/hs;
   if(WTMR[id]>=cd){WTMR[id]=0;WT[id].fire();}
  }
 }
}

/* ================= ПРОКАЧКА ================= */
function gainXp(n){
 G.xp+=n*xpMul();
 while(G.xp>=G.xpn){G.xp-=G.xpn;G.lvl++;G.xpn=Math.round(5+G.lvl*3.4);G.pend++;SFX.lvl();}
}
function addGold(n){G.gold+=Math.round(n*goldMul());}
function evoReady(){
 const out=[];
 for(const e of EVOS){
  if(G.evo[e.id])continue;
  if(wlvl(e.need[0])>=WLVLMAX&&wlvl(e.need[1])>=WLVLMAX)out.push(e);
 }
 return out;
}
function allMaxed(){
 for(const id in WPN){if(wlvl(id)<WLVLMAX&&G.w[id])return false;}
 if(Object.keys(G.w).length<WMAX)return false;
 for(const p of PASS){if(plvl(p.id)<p.max)return false;}
 return true;
}
function makeCards(){
 const out=[];
 const evos=evoReady();
 for(const e of evos)out.push({type:'evo',id:e.id,name:e.name,desc:e.desc,tag:'ЭВОЛЮЦИЯ'});
 if(out.length>0){G.cards=out.slice(0,3);G.mode='cards';return;}
 const pool=[];
 for(const id in G.w){if(wlvl(id)<WLVLMAX)pool.push({type:'w',id:id,name:WPN[id].name,desc:WPN[id].desc,tag:'ОРУЖИЕ +1'});}
 for(const p of PASS){if(plvl(p.id)<p.max)pool.push({type:'p',id:p.id,name:p.name,desc:p.desc,tag:'ПАССИВ +1'});}
 if(Object.keys(G.w).length<WMAX){for(const id in WPN){if(!G.w[id])pool.push({type:'w',id:id,name:WPN[id].name,desc:WPN[id].desc,tag:'НОВОЕ ОРУЖИЕ'});}}
 if(pool.length===0){openParagon();return;}
 const cards=[];
 for(let i=0;i<3&&pool.length;i++){const c=pool.splice(irnd(0,pool.length-1),1)[0];cards.push(c);}
 G.cards=cards;G.mode='cards';
}
function applyChoice(c){
 if(c.type==='par'){applyParagon(c.id);G.pend=Math.max(0,G.pend-1);return;}
 if(c.type==='w'){
  if(G.w[c.id]!==undefined){G.w[c.id]++;}
  else{G.w[c.id]=1;}
 }else if(c.type==='p'){
  G.p[c.id]=plvl(c.id)+1;
 }else if(c.type==='evo'){
  G.evo[c.id]=1;
 }
 G.pend=Math.max(0,G.pend-1);
 G.cards=null;G.mode='play';
}
function openParagon(){G.mode='paragon';G.cards=null;}
function applyParagon(id){
 G.par++;G.pend=Math.max(0,G.pend-1);
 if(id==='dmg')G.pdmg*=1.05;
 else if(id==='haste')G.phaste*=1.05;
 else if(id==='hp'){G.hpm+=10;G.hp+=10;}
 else if(id==='gold')addGold(50);
 G.mode='play';
}
function setBanner(txt){G.banner=txt;G.bannerT=2.2;}

/* ================= СУНДУК-РУЛЕТКА ================= */
function openRoulette(){
 const pool=[];
 for(const id in G.w){if(wlvl(id)<WLVLMAX)pool.push({type:'w',id:id,name:WPN[id].name,desc:WPN[id].desc});}
 for(const p of PASS){if(plvl(p.id)<p.max)pool.push({type:'p',id:p.id,name:p.name,desc:p.desc});}
 if(pool.length===0){for(let i=0;i<3;i++)pool.push({type:'par',id:pick(['dmg','haste','hp','gold']),name:'Благословение',desc:'Парагон-бонус'});}
 const res=[];
 for(let i=0;i<3&&pool.length;i++){res.push(pool.splice(irnd(0,pool.length-1),1)[0]);}
 if(res.length===0)res.push({type:'par',id:'gold',name:'Мешок золота',desc:'+50 монет'});
 G.roul={res:res,rot:0,spd:rnd(6,9),stopT:rnd(1.6,2.6)};
 G.roulA=0;G.roulRes=-1;G.mode='roulette';SFX.beep(330,0.2,'triangle',0.05);
}
function updateRoulette(dt){
 const r=G.roul;if(!r)return;
 if(r.stopT>0){r.stopT-=dt;r.spd=Math.max(0.8,r.spd-dt*4);}
 else{r.spd*=0.97;if(r.spd<0.25){r.spd=0;
  const seg=Math.floor(((r.rot%TAU)+TAU)%TAU/(TAU/r.res.length));
  G.roulRes=seg;G.roulT=1.6;applyChoice(r.res[seg]);setBanner('НАГРАДА: '+r.res[seg].name+' — '+r.res[seg].desc);
 }}
 r.rot+=r.spd*dt;
}

/* ================= ГЛАВНЫЙ АПДЕЙТ ================= */
function update(dt){
 if(G.mode==='roulette')updateRoulette(dt);
 if(G.mode!=='play')return;
 G.t+=dt;
 if(G.t>=600&&G.rlv===0){G.rlv=1;setBanner('НАСТУПАЕТ РАГНАРЁК!');SFX.roar();}
 else if(G.t>=600)G.rlv=Math.floor((G.t-600)/60)+1;
 G.spawnT-=dt;
 if(G.spawnT<=0){spawnWave();G.spawnT=Math.max(0.35,1.6-Math.floor(G.t/60)*0.12);}
 if(G.t>=G.nextBoss)spawnBoss();
 if(G.rlv>0){G.champT-=dt;if(G.champT<=0){spawnChampion();G.champT=30;}}
 for(let i=SQUEUE.length-1;i>=0;i--){if(G.t>=SQUEUE[i].t){SQUEUE[i].f();SQUEUE.splice(i,1);}}
 // движение игрока
 let mx=0,my=0;
 if(KEYS['a']||KEYS['arrowleft'])mx-=1;if(KEYS['d']||KEYS['arrowright'])mx+=1;
 if(KEYS['w']||KEYS['arrowup'])my-=1;if(KEYS['s']||KEYS['arrowdown'])my+=1;
 if(Joy.on){mx=Joy.dx;my=Joy.dy;}
 const ml=Math.hypot(mx,my);
 if(ml>0.01){const sp=150*HEROES[G.hero].spd;G.px+=mx/ml*sp*dt;G.py+=my/ml*sp*dt;}
 // оружие
 fireWeapons(dt);
 // щиты-орбита
 if(G.w.shield||G.evo.gale){
  const n=G.evo.gale?4+Math.floor(wlvl('shield')/2):1+Math.floor(wlvl('shield')/2);
  const rt=G.t*3.2;
  for(let i=0;i<n;i++){
   const a=rt+i*TAU/n,sx=G.px+Math.cos(a)*70,sy=G.py+Math.sin(a)*70;
   for(let j=E.length-1;j>=0;j--){const e=E[j];if(dist2(sx,sy,e.x,e.y)<(12+e.r)*(12+e.r)){hurtEnemy(e,16*wLvlMul('shield')*dt*3,(e.x-sx)*0.02,(e.y-sy)*0.02);}}
  }
 }
 // снаряды
 for(let i=P.length-1;i>=0;i--){
  const p=P[i];p.life-=dt;
  if(p.rotV)p.rot=(p.rot||0)+p.rotV*dt;
  if(!p.bolt){p.x+=p.vx*dt;p.y+=p.vy*dt;}
  else{p.y+=p.vy*dt;if(p.y>G.py)p.life=0;}
  if(p.life<=0){P.splice(i,1);continue;}
  for(let j=E.length-1;j>=0;j--){
   const e=E[j];
   if(dist2(p.x,p.y,e.x,e.y)<(p.r+e.r)*(p.r+e.r)){
    hurtEnemy(e,p.dmg,p.vx*0.01,p.vy*0.01);
    if(p.big&&p.bolt){for(const e2 of E){if(dist2(p.x,p.y,e2.x,e2.y)<90*90)hurtEnemy(e2,p.dmg*0.6,0,0);}}
    if(!p.big){if(p.pierce>0){p.pierce--;}else{P.splice(i,1);}}
    break;
   }
  }
 }
 // враги
 for(let i=E.length-1;i>=0;i--){
  const e=E[i];
  const d=Math.hypot(G.px-e.x,G.py-e.y)||1;
  e.x+=(G.px-e.x)/d*e.spd*dt;e.y+=(G.py-e.y)/d*e.spd*dt;
  if(e.hitT>0)e.hitT-=dt;
  if(e.atkT>0)e.atkT-=dt;
  if(d<e.r+12&&e.atkT<=0){playerHit(e.dmg);e.atkT=0.7;G.shake=3;}
 }
 // лут
 const pr=pickR();
 for(let i=GEM.length-1;i>=0;i--){const g=GEM[i];if(dist2(g.x,g.y,G.px,G.py)<pr*pr){gainXp(g.v);GEM.splice(i,1);SFX.pick();}}
 for(let i=COIN.length-1;i>=0;i--){const c=COIN[i];if(dist2(c.x,c.y,G.px,G.py)<pr*pr){addGold(c.v);COIN.splice(i,1);SFX.coin();}}
 for(let i=CHEST.length-1;i>=0;i--){const c=CHEST[i];if(dist2(c.x,c.y,G.px,G.py)<40*40){CHEST.splice(i,1);openRoulette();}}
 for(const s of SHRINE){
  if(!s.used&&dist2(s.x,s.y,G.px,G.py)<40*40){
   s.used=true;
   if(Math.random()<0.5){G.hp=G.hpm;setBanner('СВЯТОЕ МЕСТО: полное исцеление!');}
   else{gainXp(80);setBanner('СВЯТОЕ МЕСТО: благословение опыта!');}
   SFX.lvl();
  }
 }
 // визуал
 if(G.flash>0)G.flash-=dt;
 if(G.bannerT>0)G.bannerT-=dt;
 if(G.shake>0)G.shake=Math.max(0,G.shake-dt*12);
 for(let i=PART.length-1;i>=0;i--){const p=PART[i];p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t<=0)PART.splice(i,1);}
 if(G.pend>0){makeCards();}
}

function press(x,y,id){

function drawWorld(){
 const cx=G.px,cy=G.py;
 ctx.fillStyle='#141a22';ctx.fillRect(0,0,W,H);
 const gs=64,ox=((-cx)%gs+gs)%gs,oy=((-cy)%gs+gs)%gs;
 ctx.strokeStyle='rgba(90,110,90,0.12)';ctx.lineWidth=1;
 for(let x=ox;x<W;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
 for(let y=oy;y<H;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
 const sx=G.shake?rnd(-G.shake,G.shake):0,sy=G.shake?rnd(-G.shake,G.shake):0;
 function wx(x){return x-cx+W/2+sx;}function wy(y){return y-cy+H/2+sy;}
 for(const s of SHRINE){
  const x=wx(s.x),y=wy(s.y);
  if(x<-60||x>W+60||y<-60||y>H+60)continue;
  ctx.globalAlpha=s.used?0.3:1;
  ctx.fillStyle=s.used?'#556':'#f2e14c';circle(x,y,14);

 }
 for(const c of CHEST){const x=wx(c.x),y=wy(c.y);if(x>-40&&x<W+40&&y>-40&&y<H+40)drawSpr('chest',x,y,32);}
 for(const g of GEM){const x=wx(g.x),y=wy(g.y);if(x>-20&&x<W+20&&y>-20&&y<H+20)drawSpr('gem',x,y,g.big?26:16);}
 for(const c of COIN){const x=wx(c.x),y=wy(c.y);if(x>-20&&x<W+20&&y>-20&&y<H+20)drawSpr('coin',x,y,14);}
 for(const e of E){
  const x=wx(e.x),y=wy(e.y);
  if(x<-60||x>W+60||y<-60||y>H+60)continue;
  const wob=Math.sin(G.t*8+e.seed)*2;

  drawSpr(spr,x,y+wob,32*sc,e.hitT>0?Math.sin(G.t*40)*0.1:0);
  if(e.hp<e.mhp){
   ctx.fillStyle='#401018';ctx.fillRect(x-18*sc,y-16*sc,36*sc,4);
   ctx.fillStyle='#e04060';ctx.fillRect(x-18*sc,y-16*sc,36*sc*(e.hp/e.mhp),4);
  }
 }
 for(const p of P){const x=wx(p.x),y=wy(p.y);if(x>-40&&x<W+40&&y>-40&&y<H+40)drawSpr(p.spr,x,y,p.big?36:24,p.rot||0);}

function toggleFS(){
 const el=document.documentElement;
 try{
  if(document.fullscreenElement){if(document.exitFullscreen)document.exitFullscreen();}
  else if(el.requestFullscreen)el.requestFullscreen();
  else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
 }catch(e){}
}
function drawForge(){
 ctx.fillStyle='#0d0f14';ctx.fillRect(0,0,W,H);
 text('КУЗНИЦА И ТАВЕРНА',W/2,30,20,'#f2c14e','center',true);
 text('🪙 '+SAVE.gold,W/2,54,16,'#f2c14e','center',true);
 for(let i=0;i<FORGE.length;i++){
  const u=FORGE[i],lvl=SAVE.forge[u.id]||0,maxed=lvl>=u.max,price=forgePrice(u);
  const y=76+i*86;
  panel(10,y,W-20,78);
  text(u.name,20,y+18,14,'#e8e4d8','left',true);
  text(u.desc,20,y+38,11,'#9aa3b5','left');
  let lv='';for(let k=0;k<u.max;k++)lv+=k<lvl?'■':'□';
  text(lv,W/2+20,y+58,12,'#3ad0e0','center');
  if(maxed)btn(W-110,y+16,90,30,'МАКС',null,'#1a3a1a');
  else btn(W-110,y+16,90,30,price+' 🪙',null,SAVE.gold>=price?'#1a3a2a':'#3a1a1a');
  if(!maxed){HITS.push({x:W-110,y:y+16,w:90,h:30,fn:(function(uu){return function(){
   const p=forgePrice(uu);
   if(SAVE.gold>=p){SAVE.gold-=p;SAVE.forge[uu.id]++;saveNow();SFX.coin();}
   else SFX.beep(120,0.1,'square',0.05);
  };})(u)});}
 }
 btn(W/2-80,H-54,160,38,'← Назад',function(){G.mode='menu';saveNow();});
}
function drawCurses(){
 ctx.fillStyle='#0d0f14';ctx.fillRect(0,0,W,H);
 text('АЛТАРЬ ПРОКЛЯТИЙ',W/2,30,20,'#c05050','center',true);
 text('Тяжесть искуплена наградой',W/2,52,11,'#9aa3b5');
 for(let i=0;i<CURSES.length;i++){
  const c=CURSES[i],on=!!G.curses[c.id],y=80+i*100;
  panel(10,y,W-20,90,on?'#3a1a1a':'#1a2232',on?'#e04060':'#39435a');
  text(c.name,20,y+22,15,on?'#e04060':'#e8e4d8','left',true);
  text(c.desc,20,y+46,11,'#9aa3b5','left');
  btn(W-110,y+28,90,34,on?'ВКЛ':'ВЫКЛ',null,on?'#5a2020':'#24304a');
  HITS.push({x:W-110,y:y+28,w:90,h:30,fn:(function(cc){return function(){G.curses[cc.id]=!G.curses[cc.id];SFX.beep(G.curses[cc.id]?200:500,0.08,'triangle',0.04);};})(c)});
 }
 text('Обе сразу: награда x2.25!',W/2,H*0.62,12,'#f2c14e');
 btn(W/2-80,H-100,160,38,'⚔ В бой!',function(){startRun();});
 btn(W/2-80,H-54,160,38,'← Назад',function(){G.mode='menu';});
}
function drawCards(){
 ctx.fillStyle='rgba(10,12,18,0.85)';ctx.fillRect(0,0,W,H);
 text('НОВЫЙ УРОВЕНЬ!',W/2,H*0.14,22,'#f2c14e','center',true);
 const cs=G.cards||[];
 const cw=Math.min(110,(W-40)/cs.length-10);
 for(let i=0;i<cs.length;i++){
  const c=cs[i],x=W/2+(i-(cs.length-1)/2)*(cw+14);
  panel(x-cw/2,H*0.3,cw,150,'#24304a',c.type==='evo'?'#4fc3f7':'#f2c14e');
  const spr=(c.type==='evo')?(c.id==='mjolnir'?'mjolnir':'shield'):(c.type==='w'?c.id:(c.type==='p'?'heart':'bolt'));
  drawSpr(spr,x,H*0.3+34,26,0,c.type==='p'?HEROES[G.hero].c:null);
  text(c.tag,x,H*0.3+66,9,c.type==='evo'?'#4fc3f7':'#9aa3b5');
  text(c.name,x-cw/2+6,H*0.3+88,12,'#e8e4d8','center',true);
  wrapText(c.desc,x-cw/2+8,H*0.3+108,cw-16,10,'#9aa3b5');
  HITS.push({x:x-cw/2,y:H*0.3,w:cw,h:150,fn:(function(cc){return function(){applyChoice(cc);SFX.lvl();};})(c)});
 }
 text('Тапни по карточке',W/2,H*0.3+180,11,'#556');
}
function wrapText(t,x,y,w,size,c){
 ctx.font=size+'px sans-serif';ctx.fillStyle=c;
 const words=String(t).split(' ');let line='',yy=y;
 for(const wd of words){
  const test=line?line+' '+wd:wd;
  if(ctx.measureText(test).width>w){ctx.textAlign='left';ctx.fillText(line,x,yy);line=wd;yy+=size+3;}
  else line=test;
 }
 ctx.textAlign='left';ctx.fillText(line,x,yy);
}
function drawParagon(){
 ctx.fillStyle='rgba(10,12,18,0.9)';ctx.fillRect(0,0,W,H);
 text('БЛАГОСЛОВЕНИЕ ОДИНА',W/2,H*0.12,20,'#f2c14e','center',true);
 text('Всё прокачано. Выбор вечен — качайся бесконечно',W/2,H*0.12+22,11,'#9aa3b5');
 text('Парагон: '+G.par,W/2,H*0.12+42,13,'#4fc3f7','center',true);
 for(let i=0;i<PAR_OPTS.length;i++){
  const o=PAR_OPTS[i],y=H*0.28+i*72;
  panel(20,y,W-40,62);
  text(o.name,36,y+22,14,'#e8e4d8','left',true);
  text(o.desc,36,y+42,11,'#9aa3b5','left');
  btn(W-100,y+14,70,34,'ВЗЯТЬ',null,'#3a4a6a');
  HITS.push({x:W-100,y:y+14,w:70,h:34,fn:(function(oo){return function(){applyParagon(oo.id);SFX.lvl();};})(o)});
 }
}
function drawRoulette(){
 ctx.fillStyle='rgba(10,12,18,0.9)';ctx.fillRect(0,0,W,H);
 text('СУНДУК БОССА',W/2,H*0.14,20,'#f2c14e','center',true);
 const r=G.roul;if(!r){G.mode='play';return;}
 const R=Math.min(W,H)*0.28,cx=W/2,cy=H*0.45;
 const n=r.res.length,seg=TAU/n;
 for(let i=0;i<n;i++){
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,r.rot+i*seg,r.rot+(i+1)*seg);ctx.closePath();
  ctx.fillStyle=['#3a4a6a','#5a3a2a','#2a4a3a'][i%3];ctx.fill();ctx.strokeStyle='#f2c14e';ctx.lineWidth=2;ctx.stroke();
  const mid=r.rot+i*seg+seg/2;
  ctx.save();ctx.translate(cx+Math.cos(mid)*R*0.6,cy+Math.sin(mid)*R*0.6);ctx.rotate(mid);
  text(r.res[i].name.slice(0,10),0,0,10,'#fff');ctx.restore();
 }
 ctx.fillStyle='#f2c14e';circle(cx,cy,6);
 if(G.roulRes>=0){const c=r.res[G.roulRes];text('Получено: '+c.name,W/2,H*0.85,15,'#3ad0e0','center',true);}
 else text('Крутится...',W/2,H*0.85,13,'#9aa3b5');
}
function drawDead(){
 ctx.fillStyle='rgba(12,8,10,0.92)';ctx.fillRect(0,0,W,H);
 drawSpr('skull',W/2,H*0.13,36);
 text('ОДИН ПРИЗВАЛ В ВАЛЬГАЛЛУ',W/2,H*0.24,18,'#e04060','center',true);
 panel(W/2-110,H*0.32,220,120);
 text('Время: '+fmt(G.t),W/2,H*0.32+22,14,'#e8e4d8','center',true);
 text('Убийств: '+G.kills,W/2,H*0.32+46,14,'#e8e4d8','center',true);
 text('Уровень: '+G.lvl,W/2,H*0.32+70,14,'#e8e4d8','center',true);
 text('Парагон: '+G.par,W/2,H*0.32+94,14,'#4fc3f7','center',true);
 text('Заработано: 🪙 '+G.gold+' (сохранено)',W/2,H*0.32+142,12,'#f2c14e');
 if(G.t>=SAVE.rec.time&&G.t>0)text('★ НОВЫЙ РЕКОРД ★',W/2,H*0.32+164,13,'#f2e14c','center',true);
 btn(W/2-90,H*0.78,180,40,'⚔ ЕЩЁ РАЗ!',function(){startRun();});
 btn(W/2-90,H*0.78+50,180,36,'В меню',function(){G.mode='menu';});
}

/* ================= ГЛАВНЫЙ РЕНДЕР ================= */
function draw(){
 HITS=[];
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if(G.mode==='menu')drawMenu();
 else if(G.mode==='forge')drawForge();
 else if(G.mode==='curses')drawCurses();
 else if(G.mode==='cards')drawCards();
 else if(G.mode==='paragon')drawParagon();
 else if(G.mode==='roulette'){drawWorld();drawRoulette();drawHUD();}
 else if(G.mode==='dead')drawDead();
 else if(G.mode==='play'){drawWorld();drawHUD();}
 if(G.mode==='play'&&G.hp<G.hpm*0.3){
  ctx.fillStyle='rgba(224,64,96,0.12)';ctx.fillRect(0,0,W,H);
 }
 if(ERR.length>0){
  panel(6,H-64,W-12,58,'#3a0e12','#e04060');
  text('⚠ ОШИБКА (тапни — показать полностью)',W/2,H-46,11,'#ff8080','center',true);
  text(ERR[ERR.length-1].slice(0,70),W/2,H-28,9,'#ffb0b0');
 }
}
const ERR=[];
window.onerror=function(m){ERR.push(String(m));if(ERR.length>5)ERR.shift();return false;};
function clickUI(x,y){
 for(let i=HITS.length-1;i>=0;i--){const h=HITS[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){h.fn();return;}}
}
function loop(ts){
 const dt=Math.min(0.05,(ts-LT)/1000||0.016);LT=ts;
 try{update(dt);}catch(e){ERR.push(e.message);if(ERR.length>5)ERR.shift();}
 try{draw();}catch(e){ERR.push(e.message);if(ERR.length>5)ERR.shift();}
 requestAnimationFrame(loop);
}
let LT=0;
bindInput();
requestAnimationFrame(loop);

/* ================= API ДЛЯ ТЕСТОВ ================= */
window.__API={G:G,SAVE:SAVE,startRun:startRun,update:update,gainXp:gainXp,makeCards:makeCards,
 applyChoice:applyChoice,applyParagon:applyParagon,openRoulette:openRoulette,updateRoulette:updateRoulette,
 allMaxed:allMaxed,addGold:addGold,spawnChampion:spawnChampion,ET:ET,E:E,P:P,GEM:GEM,COIN:COIN,
 die:die,WPN:WPN,PASS:PASS,EVOS:EVOS,HEROES:HEROES,FORGE:FORGE,forgePrice:forgePrice,plvl:plvl,
 buyForge:function(id){const u=FORGE.find(function(x){return x.id===id;});const p=forgePrice(u);if(SAVE.gold>=p){SAVE.gold-=p;SAVE.forge[id]=(SAVE.forge[id]||0)+1;saveNow();return true;}return false;},
 CURSES:CURSES,KEYS:KEYS,Joy:Joy,dmgMul:dmgMul,xpMul:xpMul,goldMul:goldMul,HITS:HITS};
})();
</script>

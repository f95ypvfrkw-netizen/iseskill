<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Викинг: Выживание</title>
<style>
  html,body{margin:0;padding:0;background:#0b0e14;color:#e8e8f0;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;height:100%}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  #err{position:fixed;top:0;left:0;right:0;z-index:100;background:#c0392b;color:#fff;font-size:12px;padding:6px 10px;white-space:pre-wrap;display:none}
  #wrap{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;overflow-y:auto;background:#0b0e14}
  .screen.on{display:flex}
  h1{color:#f0b429;font-size:clamp(24px,7vw,40px);margin:0 0 2px;text-align:center}
  .sub{color:#8a93a6;font-size:14px;margin-bottom:8px}
  .btn{display:block;width:min(86vw,360px);padding:14px;border-radius:12px;border:2px solid #f0b429;background:#1c2340;color:#f0b429;font-size:18px;font-weight:700;text-align:center;cursor:pointer}
  .btn:active{background:#2a3560}
  .btn.small{font-size:15px;padding:10px}
  .cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .card{width:min(28vw,120px);padding:10px 6px;border-radius:14px;border:2px solid #2a3560;background:#141a2e;text-align:center;cursor:pointer}
  .card.sel{border-color:#f0b429;background:#222b52}
  .card img{width:64px;height:64px;image-rendering:pixelated;object-fit:contain}
  .card .nm{color:#f0b429;font-weight:700;margin-top:4px}
  .card .bf{color:#59c2ff;font-size:11px;margin-top:4px}
  #hud{position:fixed;top:0;left:0;right:0;z-index:5;display:none;padding:8px 10px;pointer-events:none}
  .bar{height:12px;border-radius:6px;background:#232a3d;overflow:hidden;margin-bottom:4px;max-width:340px}
  .bar>i{display:block;height:100%;border-radius:6px}
  #hpb>i{background:#e74c3c}
  #xpb>i{background:#59c2ff}
  #hudline{font-size:12px;color:#aeb7c8}
  #stick{position:fixed;z-index:6;left:50%;bottom:24px;width:110px;height:110px;margin-left:-55px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15);display:none}
  #nub{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(240,180,41,.5)}
  .overlay{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(5,8,14,.88);padding:16px}
  .overlay.on{display:flex}
  .upt{border:2px solid #f0b429;border-radius:12px;padding:12px;width:min(86vw,340px);background:#141a2e;cursor:pointer}
  .upt:active{background:#2a3560}
  .upt b{color:#f0b429}
  .upt span{color:#aeb7c8;font-size:13px;display:block;margin-top:2px}
  #loadmsg{color:#8a93a6}
</style>
</head>
<body>
<div id="err"></div>
<div id="wrap"><canvas id="cv"></canvas></div>

<div id="hud">
  <div class="bar" id="hpb"><i style="width:100%"></i></div>
  <div class="bar" id="xpb"><i style="width:0%"></i></div>
  <div id="hudline"></div>
</div>
<div id="stick"><div id="nub"></div></div>

<div id="scrLoad" class="screen on"><h1>ВИКИНГ: ВЫЖИВАНИЕ</h1><div id="loadmsg">Загрузка…</div></div>

<div id="scrMenu" class="screen">
  <h1>ВИКИНГ: ВЫЖИВАНИЕ</h1>
  <div class="sub">Telegram-мини-версия</div>
  <div class="cards" id="heroCards"></div>
  <div class="sub" id="heroDesc">Латы: −1 к получаемому урону</div>
  <button class="btn" onclick="A.start()">⚔ В БОЙ!</button>
  <button class="btn small" onclick="A.openForge()">⚒ Кузница и Таверна</button>
  <button class="btn small" onclick="A.openAltar()">🔥 Алтарь проклятий</button>
  <div class="sub" id="menuStat"></div>
</div>

<div id="scrForge" class="screen">
  <h1 style="font-size:24px">КУЗНИЦА И ТАВЕРНА</h1>
  <div class="sub" id="forgeGold"></div>
  <div id="forgeList" style="display:flex;flex-direction:column;gap:8px;width:100%;align-items:center"></div>
  <button class="btn small" onclick="A.show('menu')">← Назад</button>
</div>

<div id="scrAltar" class="screen">
  <h1 style="font-size:24px">АЛТАРЬ ПРОКЛЯТИЙ</h1>
  <div class="sub" id="altarInfo"></div>
  <button class="btn small" onclick="A.curse()">Принять проклятие (парагон +1)</button>
  <button class="btn small" onclick="A.show('menu')">← Назад</button>
</div>

<div id="ovCards" class="overlay"><h1 style="font-size:22px">УРОВЕНЬ!</h1><div id="cardsBox" style="display:flex;flex-direction:column;gap:8px;width:100%;align-items:center"></div></div>

<div id="scrDead" class="screen">
  <h1 style="font-size:26px">ПАЛ В БОЮ</h1>
  <div class="sub" id="deadStat"></div>
  <button class="btn" onclick="A.show('menu')">← В лагерь</button>
</div>

<script>
"use strict";
// ---------- защита от ошибок ----------
var errBox=document.getElementById('err');
function showErr(m){errBox.textContent='ОШИБКА: '+m;errBox.style.display='block';}
window.addEventListener('error',function(e){showErr(e.message+' @ строка '+(e.lineno||'?'));});

// ---------- данные ----------
var HEROES=[
 {n:'Бьёрн', col:'#4a7bd0', hp:120, dmg:1.0, spd:120, desc:'Латы: −1 к получаемому урону'},
 {n:'Сигрид',col:'#3fae6a', hp:100, dmg:1.15,spd:120, desc:'Ярость: +15% к урону'},
 {n:'Эрик',  col:'#c05a9e', hp:100, dmg:1.0, spd:145, desc:'Ветер: +20% к скорости'}
];
var ENEMY={
 goblin:{img:'monster.png',hp:18,spd:52,dmg:8,r:13,xp:3,gold:1},
 wolf:  {img:'wolf.png',  hp:30,spd:88,dmg:12,r:14,xp:6,gold:2},
 draugr:{img:'huskarl.png',hp:55,spd:46,dmg:16,r:16,xp:10,gold:3},
 shaman:{img:'shaman.png', hp:40,spd:40,dmg:10,r:15,xp:9,gold:3, ranged:true},
 imp:   {img:'fire_imp.png',hp:35,spd:80,dmg:14,r:14,xp:8,gold:2},
 warlock:{img:'warlock.png',hp:120,spd:38,dmg:20,r:18,xp:22,gold:6},
 boss:  {img:'boss.png',  hp:700,spd:42,dmg:30,r:26,xp:120,gold:40, champ:true}
};
var FROGE=['goblin']; // первые 60 сек
function poolAt(t){
 if(t<60)return['goblin'];
 if(t<150)return['goblin','goblin','wolf'];
 if(t<300)return['goblin','wolf','wolf','draugr'];
 if(t<480)return['wolf','draugr','shaman','imp'];
 return['draugr','shaman','imp','warlock'];
}
var WEAP={
 axe:{n:'Секира',d:'Вращается вокруг героя'},
 bolt:{n:'Молния',d:'Летит в ближайшего врага'},
 knives:{n:'Метательные ножи',d:'Залп вперёд по движению'}
};
var EVOS=[
 {id:'mjolnir',from:'bolt',n:'Мьёльнир',d:'Молния бьёт волной по площади'},
 {id:'storm', from:'knives',n:'Вихрь Вальгаллы',d:'Ножи летят тройным залпом'}
];

// ---------- спрайты ----------
var ASSET_NAMES=['viking.png','monster.png','huskarl.png','shaman.png','warlock.png','fire_imp.png','wolf.png','boss.png','valkyrie.png'];
var IMG={}; var loadedCount=0;
function loadAssets(done){
 var left=ASSET_NAMES.length;
 ASSET_NAMES.forEach(function(name){
  var im=new Image(); var ok=false;
  im.onload=function(){if(!ok){ok=true;loadedCount++;left--;if(left<=0)done();}};
  im.onerror=function(){if(!ok){ok=true;IMG[name]=null;left--;if(left<=0)done();}};
  im.src=name+'?v='+Date.now();
  IMG[name]=im; // рисуем, когда догрузится; если не догрузился — вектор
  setTimeout(function(){if(!ok){ok=true;left--;if(left<=0)done();}},5000);
 });
}

// ---------- состояние ----------
var A={}; // глобальные обработчики (onclick)
var hero=0, gold=0, paragon=0, best=0, totalKills=0;
try{gold=+localStorage.getItem('vg_gold')||0;paragon=+localStorage.getItem('vg_par')||0;best=+localStorage.getItem('vg_best')||0;}catch(e){}
function save(){try{localStorage.setItem('vg_gold',gold);localStorage.setItem('vg_par',paragon);localStorage.setItem('vg_best',best);}catch(e){}}

var G=null; // состояние забега
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);resize();

// ---------- экраны ----------
function show(id){
 ['scrLoad','scrMenu','scrForge','scrAltar','scrDead'].forEach(function(s){document.getElementById(s).classList.remove('on');});
 ['ovCards'].forEach(function(s){document.getElementById(s).classList.remove('on');});
 document.getElementById('hud').style.display='none';
 document.getElementById('stick').style.display='none';
 if(id==='menu'){
  document.getElementById('scrMenu').classList.add('on');
  renderMenu();
 }else if(id==='forge'){document.getElementById('scrForge').classList.add('on');renderForge();}
 else if(id==='altar'){document.getElementById('scrAltar').classList.add('on');renderAltar();}
 else if(id==='dead'){document.getElementById('scrDead').classList.add('on');}
 else if(id==='battle'){document.getElementById('hud').style.display='block';document.getElementById('stick').style.display='block';}
}
A.show=function(id){try{show(id);}catch(e){showErr(e.message);}};

// ---------- меню ----------
var selHero=0;
function renderMenu(){
 var box=document.getElementById('heroCards');box.innerHTML='';
 HEROES.forEach(function(h,i){
  var d=document.createElement('div');d.className='card'+(i===selHero?' sel':'');
  var img=document.createElement('img');img.src='viking.png?v='+Date.now();
  d.appendChild(img);
  var nm=document.createElement('div');nm.className='nm';nm.textContent=h.n;d.appendChild(nm);
  var bf=document.createElement('div');bf.className='bf';bf.textContent=h.desc.split(':')[1]||h.desc;d.appendChild(bf);
  d.onclick=function(){selHero=i;renderMenu();};
  box.appendChild(d);
 });
 document.getElementById('heroDesc').textContent=HEROES[selHero].desc;
 document.getElementById('menuStat').textContent='Рекорд: '+fmt(best)+' · Убийств: '+totalKills+' · Парагон: ×'+paragon+' · Золото: '+gold;
}
function fmt(s){var m=Math.floor(s/60),ss=Math.floor(s%60);return m+':'+(ss<10?'0':'')+ss;}
A.selectHero=function(i){selHero=i;renderMenu();};
A.start=function(){try{newRun();show('battle');}catch(e){showErr('старт боя: '+e.message);}};

// ---------- кузница ----------
var forgeLv={dmg:0,hp:0,spd:0};
function forgeCost(k){return 60*Math.pow(1.5,forgeLv[k]);}
function renderForge(){
 document.getElementById('forgeGold').textContent='Золото: '+gold;
 var box=document.getElementById('forgeList');box.innerHTML='';
 [['dmg','Клинок: +10% урона'],['hp','Мешок жизни: +15 HP'],['spd','Сапоги: +8% скорости']].forEach(function(p){
  var k=p[0],c=forgeCost(k);
  var b=document.createElement('button');b.className='btn small';
  b.textContent=p[1]+' — '+c+' зол. (ур.'+forgeLv[k]+')';
  b.onclick=function(){if(gold>=c){gold-=c;forgeLv[k]++;save();renderForge();}};
  box.appendChild(b);
 });
}
A.openForge=function(){show('forge');};
A.openAltar=function(){show('altar');renderAltar();};
function renderAltar(){document.getElementById('altarInfo').textContent='Парагон сейчас: ×'+paragon+'. Каждое проклятие навсегда даёт +10% к урону, но −5% к максимальному HP.';}
A.curse=function(){paragon++;save();renderAltar();};

// ---------- новый забег ----------
function newRun(){
 var h=HEROES[selHero];
 G={time:0,kills:0,xp:0,lv:1,pend:0,
   px:W/2,py:H/2,hp:maxHp(),maxHp:maxHp(),
   spd:h.spd*(1+0.08*forgeLv.spd)*(1+0.08*paragon),
   dmgMul:(HEROES[selHero].dmg+0.10*forgeLv.dmg)*(1+0.10*paragon),
   arm:selHero===0?1:0,
   enemies:[],projs:[],gems:[],orbits:[],waves:[],
   wep:{axe:1},cool:{axe:0},inv:0,
   shake:0,ragnarok:false,nextChamp:180
 };
 G.orbits.push({a:0});
}
function maxHp(){var h=HEROES[selHero]||HEROES[0];return Math.round(h.hp*(1+0.15*forgeLv.hp)*(1-0.05*paragon));}

// ---------- ввод (джойстик) ----------
var stick={x:0,y:0,on:false};
(function(){
 var st=document.getElementById('stick'),nub=document.getElementById('nub');
 function set(e){
  var r=st.getBoundingClientRect();
  var cx=r.left+r.width/2,cy=r.top+r.height/2;
  var t=e.touches?e.touches[0]:e;
  var dx=t.clientX-cx,dy=t.clientY-cy;
  var len=Math.sqrt(dx*dx+dy*dy),m=r.width/2;
  if(len>m){dx=dx/len*m;dy=dy/len*m;}
  stick.x=dx/m;stick.y=dy/m;stick.on=true;
  nub.style.transform='translate('+dx+'px,'+dy+'px)';
 }
 function end(){stick.x=0;stick.y=0;stick.on=false;nub.style.transform='';}
 st.addEventListener('touchstart',function(e){e.preventDefault();set(e);},{passive:false});
 st.addEventListener('touchmove',function(e){e.preventDefault();set(e);},{passive:false});
 st.addEventListener('touchend',end);
 st.addEventListener('mousedown',set);window.addEventListener('mousemove',function(e){if(stick.on)set(e);});
 window.addEventListener('mouseup',end);
})();

// ---------- спавн ----------
function spawnEnemy(type){
 var t=ENEMY[type],k=t.champ?1.6:1;
 var ang=Math.random()*Math.PI*2,R=Math.max(W,H)*0.6+40;
 G.enemies.push({type:type,x:G.px+Math.cos(ang)*R,y:G.py+Math.sin(ang)*R,
  hp:t.hp*k,mhp:t.hp*k,spd:t.spk||t.spd*(1+G.time/900),dmg:t.dmg*k,r:t.r,xp:t.xp,gold:t.gold,champ:!!t.champ,hit:0});
 if(t.champ)G.waves.push(0);
}
function spawnTimer(dt){
 if(G.time>=600&&!G.ragnarok){G.ragnarok=true;}
 var rate=G.ragnarok?0.45:(0.55+G.time/240);
 G.spAcc=(G.spAcc||0)+dt*rate;
 while(G.spAcc>=1){G.spAcc-=1;
  var pool=G.ragnarok?poolAt(999):poolAt(G.time);
  if(G.ragnarok&&Math.random()<0.12)spawnEnemy('boss');else spawnEnemy(pool[Math.floor(Math.random()*pool.length)]);
 }
 G.nextChamp-=dt;
 if(G.nextChamp<=0){G.nextChamp=180;spawnEnemy('boss');}
}

// ---------- оружие ----------
function fireWeapons(dt){
 for(var k in G.wep){
  var lvl=G.wep[k];G.cool[k]=(G.cool[k]||0)-dt*lvl;
  if(G.cool[k]<=0){
   G.cool[k]=0.9;
   if(k==='axe'){for(var i=0;i<lvl+1;i++)G.orbits.push({a:i*(Math.PI*2/(lvl+1)),life:0.9});}
   if(k==='bolt'){
    var ne=nearest(G.px,G.py,700);
    if(ne){var a=Math.atan2(ne.y-G.py,ne.x-G.px);G.projs.push({x:G.px,y:G.py,vx:Math.cos(a)*380,vy:Math.sin(a)*380,dmg:14*G.dmgMul,life:1.4,r:6});}
   }
   if(k==='knives'){
    var n=(G.wep.storm?3:1);
    for(var j=0;j<n;j++)G.projs.push({x:G.px,y:G.py,vx:stick.x*300||0,vy:stick.y*300||-300,dmg:9*G.dmgMul,life:0.8,r:5});
   }
  }
 }
 // Мьёльнир — волна
 if(G.wep.mjolnir){G.mj=(G.mj||0)-dt;if(G.mj<=0){G.mj=2;
  G.enemies.forEach(function(e){var dx=e.x-G.px,dy=e.y-G.py;if(dx*dx+dy*dy<180*180)hurt(e,25*G.dmgMul);});}}
}
function nearest(x,y,R){var b=null,bd=R*R;G.enemies.forEach(function(e){var dx=e.x-x,dy=e.y-y,d=dx*dx+dy*dy;if(d<bd){bd=d;b=e;}});return b;}
function hurt(e,d){if(e.hit>0)return;e.hp-=d;e.hit=0.1;
 var a=Math.atan2(e.y-G.py,e.x-G.px);e.x+=Math.cos(a)*14;e.y+=Math.sin(a)*14;
 if(e.hp<=0)kill(e);}
function kill(e){G.kills++;totalKills++;G.gems.push({x:e.x,y:e.y,xp:e.xp});gold+=e.gold;e.dead=true;
 if(G.kills%15===0){/* сундук */}
}
A.gemTotal=0;
function gainXp(v){
 G.xp+=v;
 while(G.xp>=xpNeed(G.lv)){G.xp-=xpNeed(G.lv);G.pend++;}
 if(G.pend>0)openCards();
}
function xpNeed(l){return Math.round(12*Math.pow(1.4,l-1));}

// ---------- карточки ----------
var upgrades=[
 {id:'axe',n:'Секира +1',d:'Ещё одно лезвие',w:'axe'},
 {id:'bolt',n:'Молния +1',d:'Быстрее и чаще',w:'bolt'},
 {id:'knives',n:'Ножи +1',d:'Залп чаще',w:'knives'},
 {id:'hp',n:'Мешок жизни',d:'+15 макс. HP и лечение',f:function(){G.maxHp+=15;G.hp+=15;}},
 {id:'spd',n:'Сапоги',d:'+10% скорости',f:function(){G.spd*=1.10;}},
 {id:'dmg',n:'Ярость',d:'+10% урона',f:function(){G.dmgMul*=1.10;}}
];
function openCards(){
 G.paused=true;
 var box=document.getElementById('cardsBox');box.innerHTML='';
 var pool=upgrades.filter(function(u){
  if(u.w){if(G.wep[u.w]>=8)return false;if(EVOS.some(function(e){return e.from===u.w&&G.wep[u.w]>=5&&!G.wep[e.id];})&&Math.random()<0.3)return true;return true;}
  return true;
 });
 if(pool.length===0)pool=[{n:'Мёд Одина',d:'+20 HP',f:function(){G.maxHp+=20;G.hp+=20;}}];
 pool.slice(0,3).forEach(function(u){
  var b=document.createElement('button');b.className='upt';
  b.innerHTML='<b>'+u.n+'</b><span>'+u.d+'</span>';
  b.onclick=function(){try{if(u.w)G.wep[u.w]=(G.wep[u.w]||0)+1;else u.f();}catch(e){showErr(e.message);}
   G.pend--;if(G.pend>0)openCards();else{G.paused=false;document.getElementById('ovCards').classList.remove('on');}};
  box.appendChild(b);
 });
 document.getElementById('ovCards').classList.add('on');
}

// ---------- апдейт ----------
function upd(dt){
 if(!G||G.paused)return;
 G.time+=dt;
 if(G.inv>0)G.inv-=dt;
 spawnTimer(dt);
 var h=HEROES[hero];
 G.px+=stick.x*G.spd*dt;G.py+=stick.y*G.spd*dt;
 fireWeapons(dt);
 // орбиты секир
 G.orbits=G.orbits.filter(function(o){o.life-=dt;o.a+=dt*4;return o.life>0;});
 G.orbits.forEach(function(o){
  var ox=G.px+Math.cos(o.a)*56,oy=G.py+Math.sin(o.a)*56;
  G.enemies.forEach(function(e){if(e.dead)return;var dx=e.x-ox,dy=e.y-oy;if(dx*dx+dy*dy<(e.r+10)*(e.r+10))hurt(e,10*G.dmgMul);});
 });
 // снаряды
 G.projs=G.projs.filter(function(p){
  p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  var hitAny=false;
  G.enemies.forEach(function(e){if(e.dead)return;var dx=e.x-p.x,dy=e.y-p.y;if(dx*dx+dy*dy<(e.r+p.r)*(e.r+p.r)){hurt(e,p.dmg);hitAny=true;}});
  return p.life>0&&!hitAny;
 });
 // враги
 G.enemies=G.enemies.filter(function(e){return !e.dead;});
 G.enemies.forEach(function(e){
  if(e.hit>0)e.hit-=dt;
  var dx=G.px-e.x,dy=G.py-e.y,d=Math.sqrt(dx*dx+dy*dy)||1;
  e.x+=dx/d*e.spd*dt;e.y+=dy/d*e.spd*dt;
  if(d<e.r+12&&G.inv<=0)damagePlayer(e);
 });
 // подбор кристаллов
 G.gems=G.gems.filter(function(g){
  var dx=g.x-G.px,dy=g.y-G.py;
  if(dx*dx+dy*dy<40*40){gainXp(g.xp);return false;}
  g.x-=dx*0.2;g.y-=dy*0.2;
  return true;
 });
 if(G.hp<=0)die();
}
function die(){
 best=Math.max(best,G.time);save();
 document.getElementById('deadStat').textContent='Время: '+fmt(G.time)+' · Убийств: '+G.kills+' · Золото собрано: '+gold;
 show('dead');G=null;
}

// ---------- отрисовка ----------
function draw(){
 ctx.fillStyle='#0b0e14';ctx.fillRect(0,0,W,H);
 if(!G)return;
 var sx=0,sy=0;
 if(G.shake>0){G.shake-=1/60;sx=(Math.random()-0.5)*6;sy=(Math.random()-0.5)*6;}
 ctx.save();ctx.translate(sx,sy);
 // сетка
 ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;
 var gs=60,ox=-G.px%gs,oy=-G.py%gs;
 ctx.beginPath();
 for(var x=ox;x<W;x+=gs){ctx.moveTo(x,0);ctx.lineTo(x,H);}
 for(var y=oy;y<H;y+=gs){ctx.moveTo(0,y);ctx.lineTo(W,y);}
 ctx.stroke();
 // кристаллы
 ctx.fillStyle='#59c2ff';
 G.gems.forEach(function(g){ctx.beginPath();ctx.arc(g.x,g.y,4,0,7);ctx.fill();});
 // враги
 G.enemies.forEach(function(e){
  var t=ENEMY[e.type];
  drawSprite(t.img,e.x,e.y,e.r*2,e.r*2,e.hit>0);
  if(e.champ){ctx.strokeStyle='rgba(255,60,60,.8)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x,e.y,e.r+6,0,7);ctx.stroke();}
 });
 // герой
 var h=HEROES[selHero];
 drawSprite('viking.png',G.px,G.py,26,26,false,h.col);
 // секиры
 G.orbits.forEach(function(o){
  var ox=G.px+Math.cos(o.a)*56,oy=G.py+Math.sin(o.a)*56;
  ctx.save();ctx.translate(ox,oy);ctx.rotate(o.a*2);ctx.fillStyle='#cfd8e3';ctx.fillRect(-10,-3,20,6);ctx.restore();
 });
 // снаряды
 G.projs.forEach(function(p){ctx.fillStyle='#f0b429';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();});
 ctx.restore();
 hud();
}
function drawSprite(name,x,y,w,h2,tinted,col){
 var im=IMG[name];
 if(im&&im.complete&&im.naturalWidth>0){
  if(col){ctx.save();ctx.globalAlpha=0.9;}
  try{ctx.drawImage(im,x-w/2,y-h2/2,w,h2);}catch(e){}
  if(col){
   ctx.globalCompositeOperation='source-atop';
   ctx.globalAlpha=0.35;ctx.fillStyle=col;
   ctx.fillRect(x-w/2,y-h2/2,w,h2);
   ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.restore();
  }
 }else{
  ctx.fillStyle=col||'#7a8699';
  ctx.beginPath();ctx.arc(x,y-h2*0.2,w*0.28,0,7);ctx.fill();
  ctx.fillRect(x-w*0.22,y-h2*0.05,w*0.44,h2*0.55);
 }
}
function hud(){
 document.getElementById('hpb').firstElementChild.style.width=Math.max(0,G.hp/G.maxHp*100)+'%';
 document.getElementById('xpb').firstElementChild.style.width=(G.xp/xpNeed(G.lv)*100)+'%';
 document.getElementById('hudline').textContent='Время '+fmt(G.time)+(G.ragnarok?' · РАГНАРЁК!':'')+' · Убийств '+G.kills+' · Ур.'+G.lv+(G.pend?' (+'+G.pend+')':'');
}

// ---------- цикл ----------
var last=0;
function loop(t){
 requestAnimationFrame(loop);
 var dt=Math.min((t-last)/1000,0.05);last=t;
 if(G&&!G.paused){try{upd(dt);}catch(e){showErr('апдейт: '+e.message);G.paused=true;}}
 try{draw();}catch(e){showErr('отрисовка: '+e.message);}
}
requestAnimationFrame(loop);

// смерть подправим урон: аккуратная версия внутри upd уже с латами
function damagePlayer(e){
 var dmg=e.dmg-(selHero===0?1:0);
 G.hp-=Math.max(1,dmg);G.inv=0.6;G.shake=0.2;
}
</script>
